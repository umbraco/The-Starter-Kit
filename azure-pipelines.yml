name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
  - name: cache_nuget
    displayName: Cache NuGet packages
    type: boolean
    default: false

variables:
  solution: Umbraco.SampleSite.sln
  buildConfiguration: Release
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Whether this branch's major is released, so its uploads may become the latest version in Dependency-Track.
  dependencyTrackMarkAsLatest: true

stages: 
  - stage: Build
    variables:
      NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
      npm_config_cache: $(Pipeline.Workspace)/.npm_client
    jobs:
      - job: Build
        pool: 
          vmImage: ubuntu-latest
        steps:
          # Checkout source (avoid shallow clone to calculate version height)
          - checkout: self
            fetchDepth: 0

          # Setup build environment
          - task: NuGetAuthenticate@1
            displayName: Authenticate NuGet

          - task: UseDotNet@2
            displayName: Use .NET SDK from global.json
            inputs:
              useGlobalJson: true

          # Cache and restore NuGet packages
          - task: Cache@2
            condition: ${{ parameters.cache_nuget }}
            displayName: Cache NuGet packages
            inputs:
              key: 'nuget | "$(Agent.OS)" | **/packages.lock.json, !**/bin/**, !**/obj/**'
              restoreKeys: |
                nuget | "$(Agent.OS)"
                nuget
              path: $(NUGET_PACKAGES)

          - script: dotnet restore $(solution) --locked-mode
            displayName: Restore NuGet packages

          # Build
          - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore -p:ContinuousIntegrationBuild=true
            displayName: Run dotnet build

          # Pack (using --no-build causes RCL projects to generate an invalid package, even using .NET SDK 7, so keep --no-restore for now)
          - script: dotnet pack $(solution) --configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/nupkg
            displayName: Run dotnet pack

          # Publish
          - task: PublishPipelineArtifact@1
            displayName: Publish NuGet packages
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/nupkg
              artifactName: nupkg

          - task: PublishPipelineArtifact@1
            displayName: Publish build output
            inputs:
              targetPath: $(Build.SourcesDirectory)
              artifactName: build_output

  - stage: Dependency_Track
    displayName: Dependency Track
    dependsOn:
      - Build
    jobs:
      - job: sbom
        displayName: Upload SBOMs to Dependency Track
        pool: 
          vmImage: windows-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: Read version from version.json
            inputs:
              targetType: 'inline'
              script: |
                $versionJson = Get-Content -Path "version.json" -Raw | ConvertFrom-Json
                $version = $versionJson.version
                if ([string]::IsNullOrWhiteSpace($version)) {
                    throw "Version is empty or missing in version.json"
                }
                $majorVersion = $version.Split('.')[0]
                Write-Host "Full version from version.json: $version"
                Write-Host "Major version: $majorVersion"
                Write-Host "##vso[task.setvariable variable=VersionNumber]$majorVersion"

          - task: UseDotNet@2
            displayName: Use .NET SDK from global.json
            inputs:
              useGlobalJson: true

          - script: dotnet restore $(solution) --locked-mode
            displayName: Restore NuGet packages

          - pwsh: |
              dotnet tool install --tool-path "$(Agent.TempDirectory)/umbraco-sbom" Umbraco.Internal.Sbom
              & "$(Agent.TempDirectory)/umbraco-sbom/umbraco-sbom" $(solution) --output-file "$(Build.SourcesDirectory)/bom.xml"
              # Exit code 10 means the SBOM was written, with warnings for unresolved licenses.
              if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 10) { exit $LASTEXITCODE }
              exit 0
            displayName: Generate SBOM with Umbraco.Internal.Sbom

          - publish: bom.xml
            artifact: sbom
            displayName: Publish SBOM artifact

          - pwsh: |
              function Test-IsLatest([string] $name, [string] $version) {
                  try {
                      $versions = Invoke-RestMethod -Uri "$($env:DT_URL.TrimEnd('/'))/api/v1/project?name=$([uri]::EscapeDataString($name))&pageSize=1000" -Headers @{ 'X-Api-Key' = $env:DT_KEY }
                  } catch {
                      Write-Host "##vso[task.logissue type=warning]Could not read the versions of '$name' from Dependency-Track, so it is not marked as latest: $_"
                      return $false
                  }
                  $latest = @($versions | Where-Object { $_.isLatest })[0]
                  $latestMajor = 0
                  $isLatest = -not ($latest -and [int]::TryParse($latest.version.Split('.')[0], [ref] $latestMajor) -and $latestMajor -gt [int] $version.Split('.')[0])
                  Write-Host "Latest version of '$name' in Dependency-Track: $(if ($latest) { $latest.version } else { 'none' }). Mark $version as latest: $isLatest"
                  return $isLatest
              }

              $isLatest = '$(dependencyTrackMarkAsLatest)' -eq 'true' -and (Test-IsLatest 'The-Starter-Kit' '$(VersionNumber)')
              Write-Host "##vso[task.setvariable variable=isLatest]$($isLatest.ToString().ToLower())"
            displayName: Determine whether to mark as latest
            env:
              DT_URL: $(DT_API_URL)
              DT_KEY: $(DT_API_KEY)

          - task: upload-bom-dtrack@1
            displayName: Upload SBOM to Dependency Track
            inputs:
              bomFilePath: bom.xml
              dtrackProjName: The-Starter-Kit
              dtrackProjVersion: $(VersionNumber)
              dtrackProjClassifier: APPLICATION
              dtrackIsLatest: $(isLatest)
              dtrackAPIKey: $(DT_API_KEY)
              dtrackURI: $(DT_API_URL)
              dtrackProjAutoCreate: true
